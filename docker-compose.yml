version: "3.8"
services:
  app:
    build: .
    volumes:
      - .:/app
      - nginx_videos:/usr/share/nginx/html/videos
    env_file:
      - .env
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "clip_manager.py", "--server.address=0.0.0.0"]
    deploy:
      resources:
        limits:
          memory: 1.4G
          cpus: '0.8'
        reservations:
          memory: 800M
          cpus: '0.2'
    restart: unless-stopped
    environment:
      - MOVIEPY_THREADS=1
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONUNBUFFERED=1

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - nginx_videos:/usr/share/nginx/html/videos
    ports:
      - "80:80"
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped

volumes:
  nginx_videos: