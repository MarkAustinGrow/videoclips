version: '3.8'

services:
  app:
    build: .
    volumes:
      - .:/app
      - shared_videos:/usr/share/nginx/html/videos
    env_file:
      - .env
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "clip_manager.py", "--server.address=0.0.0.0"]

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - shared_videos:/usr/share/nginx/html/videos
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  shared_videos: 