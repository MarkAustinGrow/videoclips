version: "3.8"
services:
  app:
    build: .
    volumes:
      - .:/app
      - nginx_videos:/usr/share/nginx/html/videos
      - generated_videos:/app/generated_videos
      - /tmp:/tmp  # Share host /tmp for better memory management
    env_file:
      - .env
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "clip_manager.py", "--server.address=0.0.0.0"]
    deploy:
      resources:
        limits:
          memory: 1.6G
        reservations:
          memory: 512M
    environment:
      - MOVIEPY_THREADS=1
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONUNBUFFERED=1
      - MPLBACKEND=Agg
    restart: unless-stopped
    shm_size: '256mb'

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - nginx_videos:/usr/share/nginx/html/videos
      - generated_videos:/usr/share/nginx/html/generated_videos
    ports:
      - "80:80"
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped

volumes:
  nginx_videos:
  generated_videos:
